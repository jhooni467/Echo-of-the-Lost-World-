<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101a2b">
<title>Ecos del mundo perdido</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a2b;color:#fff;font-family:system-ui,sans-serif;touch-action:none}#game{width:100%;height:100%;display:flex;align-items:center;justify-content:center}canvas{display:block;max-width:100%;max-height:100%;image-rendering:pixelated}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-weight:800;text-shadow:2px 2px #172033}.pill{background:#17263ddd;border:2px solid #91d76b;border-radius:9px;padding:6px 9px;font-size:12px}#controls{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}.cluster{display:flex;gap:9px;pointer-events:auto}.ctrl{width:58px;height:58px;border:2px solid #d7f7a2;border-radius:14px;background:#243d50dd;color:white;font-size:23px;font-weight:900;touch-action:none}.small{width:68px;font-size:15px}#overlay{position:fixed;inset:0;background:#0c1725ee;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}#panel{width:min(440px,100%);background:#1b3041;border:3px solid #8bd36b;border-radius:18px;padding:20px;text-align:center}h1{font-size:25px;margin:0 0 8px;color:#b8f28a}p{line-height:1.4;color:#e0e9df}.choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.swatch{width:42px;height:42px;border:3px solid #ffffff88;border-radius:9px}.action{background:#9ce36e;border:0;border-radius:10px;padding:12px 20px;font-weight:900;font-size:16px;color:#172033;margin-top:8px}.hint{font-size:12px;color:#b8c9c5}#toast{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#17263ddd;padding:8px 12px;border:1px solid #b8f28a;border-radius:8px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="game"></div><div id="hud"><div class="pill" id="health">♥ ♥ ♥</div><div class="pill" id="score">Fragmentos: 0</div><div class="pill">Bosque ancestral</div></div><div id="toast"></div>
<div id="controls"><div class="cluster"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button></div><div class="cluster"><button class="ctrl small" data-key="attack">⚔ ATQ</button><button class="ctrl" data-key="jump">⬆</button></div></div>
<div id="overlay"><div id="panel"><h1>ECOS DEL MUNDO PERDIDO</h1><p>Personaliza el color de tu explorador y comienza a buscar los fragmentos perdidos.</p><div class="choices"><button class="swatch" data-color="#e9a35b" style="background:#e9a35b"></button><button class="swatch" data-color="#72c9d6" style="background:#72c9d6"></button><button class="swatch" data-color="#d77db5" style="background:#d77db5"></button><button class="swatch" data-color="#a58be8" style="background:#a58be8"></button><button class="swatch" data-color="#a8d96b" style="background:#a8d96b"></button></div><p class="hint">◀ ▶ moverse · ⬆ saltar · ⚔ atacar</p><button class="action" id="start">COMENZAR AVENTURA</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
const W=960,H=540,held={left:false,right:false,jump:false,attack:false};let heroColor='#e9a35b',score=0,hp=3,player,monsters,platforms,facing=1,attackReady=true;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1200)}
class Forest extends Phaser.Scene{
constructor(){super('forest')}
create(){
this.physics.world.setBounds(0,0,2200,H);this.cameras.main.setBounds(0,0,2200,H);this.cameras.main.setBackgroundColor('#74dce0');
for(let i=0;i<10;i++){this.add.circle(i*270+70,130,85,0x56b5a0).setScrollFactor(.25);this.add.circle(i*270+160,170,105,0x348b73).setScrollFactor(.4)}
for(let x=0;x<2200;x+=100){this.add.rectangle(x+50,480,100,120,0x76503f);this.add.rectangle(x+50,420,100,18,0x75c957);this.add.rectangle(x+50,408,100,7,0xb2f078)}
platforms=this.physics.add.staticGroup();for(let x=0;x<2200;x+=100){let p=platforms.create(x+50,480,'pixel').setVisible(false);p.body.setSize(100,30)}
[[360,390,150],[650,330,150],[940,400,160],[1230,345,160],[1530,390,170],[1830,320,180]].forEach(([x,y,w])=>{let p=platforms.create(x,y,'pixel').setVisible(false);p.body.setSize(w,20).setOffset(0,0);this.add.rectangle(x,y,w,14,0x77d45b).setStrokeStyle(3,0x315e46);this.add.rectangle(x,y+9,w,7,0x9b654b)});
player=this.physics.add.sprite(90,390,'hero').setDepth(5);player.setCollideWorldBounds(true);player.body.setSize(24,34).setOffset(4,6);this.physics.add.collider(player,platforms);
monsters=this.physics.add.group();[[500,420],[800,270],[1120,420],[1450,300],[1740,420]].forEach(([x,y])=>{let m=this.physics.add.sprite(x,y,'slime').setDepth(4);m.setCollideWorldBounds(true);m.body.setSize(30,22).setOffset(3,8);m.dir=-1;monsters.add(m)});this.physics.add.collider(monsters,platforms);
const gems=this.physics.add.staticGroup();[[260,370],[430,300],[700,260],[1010,350],[1300,275],[1590,320],[1930,250]].forEach(([x,y])=>gems.create(x,y,'gem'));this.physics.add.overlap(player,gems,(p,g)=>{g.destroy();score++;document.getElementById('score').textContent='Fragmentos: '+score;toast('¡Fragmento encontrado!')});
this.physics.add.overlap(player,monsters,(p,m)=>{if(p.body.velocity.y>80&&p.y<m.y-5){m.destroy();p.setVelocityY(-280);toast('¡Criatura derrotada!')}else if(this.time.now>(this.lastHit||0)+900){this.lastHit=this.time.now;hp--;document.getElementById('health').textContent='♥ '.repeat(Math.max(0,hp))||'—';p.setVelocityX(-facing*220);p.setTint(0xff7777);this.time.delayedCall(250,()=>p.clearTint());if(hp<=0){toast('Sin energía. Reiniciando…');this.time.delayedCall(1200,()=>location.reload())}}});
this.add.text(35,35,'BOSQUE ANCESTRAL',{fontFamily:'monospace',fontSize:'20px',color:'#fff',stroke:'#24434a',strokeThickness:5}).setScrollFactor(0);this.cameras.main.startFollow(player,true,.08,.08);this.cameras.main.setDeadzone(180,100);
this.keys=this.input.keyboard.addKeys('A,D,W,SPACE,J');this.input.keyboard.createCursorKeys();
}
makeTextures(){const g=this.add.graphics();g.fillStyle(0xffffff);g.fillRect(0,0,2,2);g.generateTexture('pixel',2,2);g.clear();g.fillStyle(Phaser.Display.Color.HexStringToColor(heroColor).color);g.fillRect(5,12,22,24);g.fillStyle(0xffd2a0);g.fillRect(8,2,17,14);g.fillStyle(0x382c3b);g.fillRect(11,7,3,3);g.fillRect(20,7,3,3);g.fillStyle(0x49344a);g.fillRect(5,35,8,5);g.fillRect(20,35,8,5);g.generateTexture('hero',32,40);g.clear();g.fillStyle(0x8fe05e);g.fillRoundedRect(2,8,30,22,8);g.fillStyle(0x253b46);g.fillRect(9,15,4,5);g.fillRect(22,15,4,5);g.generateTexture('slime',34,34);g.clear();g.fillStyle(0xffdf65);g.fillPoints([{x:12,y:0},{x:24,y:12},{x:12,y:24},{x:0,y:12}],true);g.generateTexture('gem',24,24);g.destroy()}
update(){const k=this.keys,left=held.left||k.A.isDown||this.input.keyboard.keys[37]?.isDown,right=held.right||k.D.isDown||this.input.keyboard.keys[39]?.isDown,jump=held.jump||k.W.isDown||k.SPACE.isDown||this.input.keyboard.keys[38]?.isDown,attack=held.attack||k.J.isDown;
if(left){player.setVelocityX(-210);player.setFlipX(true);facing=-1}else if(right){player.setVelocityX(210);player.setFlipX(false);facing=1}else player.setVelocityX(0);
if(jump&&player.body.blocked.down)player.setVelocityY(-430);
if(attack&&attackReady){attackReady=false;const area=new Phaser.Geom.Rectangle(player.x+(facing>0?15:-65),player.y-15,55,45);monsters.getChildren().slice().forEach(m=>{if(Phaser.Geom.Rectangle.Contains(area,m.x,m.y)){m.destroy();toast('¡Ataque certero!')}});this.time.delayedCall(420,()=>attackReady=true)}
monsters.getChildren().forEach(m=>{if(!m.active)return;if(Math.abs(m.x-player.x)<350)m.setVelocityX(m.x<player.x?55:-55);else m.setVelocityX(m.dir*35);if(m.body.blocked.left||m.body.blocked.right)m.dir*=-1});
if(player.y>H+80){player.setPosition(80,350);player.setVelocity(0,0);hp--;document.getElementById('health').textContent='♥ '.repeat(Math.max(0,hp))}}
}
const config={type:Phaser.AUTO,parent:'game',width:W,height:H,pixelArt:true,physics:{default:'arcade',arcade:{gravity:{y:900},debug:false}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Forest]};
document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>{heroColor=b.dataset.color;document.querySelectorAll('.swatch').forEach(x=>x.style.borderColor='#ffffff88');b.style.borderColor='#fff'}));
document.getElementById('start').addEventListener('click',()=>{document.getElementById('overlay').style.display='none';new Phaser.Game(config)});
document.querySelectorAll('.ctrl').forEach(b=>{const k=b.dataset.key,down=e=>{e.preventDefault();held[k]=true},up=e=>{e.preventDefault();held[k]=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up)});
</script></body></html>
