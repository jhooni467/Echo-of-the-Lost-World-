<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101a2b">
<title>Ecos del mundo perdido</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a2b;color:#fff;font-family:system-ui,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;background:#101a2b}
#game canvas{display:block;max-width:100vw;max-height:100vh;max-height:100dvh;image-rendering:pixelated}
#hud{position:fixed;z-index:3;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;gap:6px;pointer-events:none;font-weight:800;text-shadow:2px 2px #172033}
.pill{background:#17263ddd;border:2px solid #91d76b;border-radius:9px;padding:clamp(5px,1vw,9px) clamp(7px,1.4vw,12px);font-size:clamp(10px,1.6vw,15px);white-space:nowrap}
#controls{position:fixed;z-index:3;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 max(12px,env(safe-area-inset-left)) 0 max(12px,env(safe-area-inset-right));pointer-events:none}
.cluster{display:flex;gap:clamp(7px,1.5vw,12px);pointer-events:auto}
.ctrl{width:clamp(48px,7vw,66px);height:clamp(48px,10vh,66px);border:2px solid #d7f7a2;border-radius:14px;background:#243d50e8;color:white;font-size:clamp(19px,3vw,25px);font-weight:900;touch-action:none;user-select:none;-webkit-user-select:none}
.small{width:clamp(66px,9vw,84px);font-size:clamp(13px,2vw,17px)}
#overlay{position:fixed;z-index:5;inset:0;background:#0c1725ee;display:flex;align-items:center;justify-content:center;padding:14px}
#panel{width:min(440px,100%);max-height:92dvh;overflow:auto;background:#1b3041;border:3px solid #8bd36b;border-radius:18px;padding:clamp(14px,3vh,22px);text-align:center}
h1{font-size:clamp(20px,4vw,28px);margin:0 0 8px;color:#b8f28a}
p{line-height:1.4;color:#e0e9df;margin:8px 0}
.choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.swatch{width:40px;height:40px;border:3px solid #ffffff88;border-radius:9px}
.action{background:#9ce36e;border:0;border-radius:10px;padding:12px 20px;font-weight:900;font-size:16px;color:#172033;margin-top:8px}
.hint{font-size:12px;color:#b8c9c5}
#toast{position:fixed;z-index:4;top:58px;left:50%;transform:translateX(-50%);background:#17263ddd;padding:8px 12px;border:1px solid #b8f28a;border-radius:8px;opacity:0;pointer-events:none;white-space:nowrap}
#rotate{display:none}
@media (orientation:portrait){
 #rotate{position:fixed;z-index:20;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;background:#101a2b;text-align:center}
 #game,#hud,#controls,#overlay,#toast{display:none!important}
 .phone{font-size:66px;line-height:1}
 #rotate h2{color:#b8f28a;margin:0;font-size:23px}
 #rotate p{max-width:310px;color:#d7e2db}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="pill" id="health">♥ ♥ ♥</div><div class="pill" id="score">Fragmentos: 0</div><div class="pill">Bosque ancestral</div></div>
<div id="toast"></div>
<div id="controls">
 <div class="cluster"><button class="ctrl" data-key="left" aria-label="Mover a la izquierda">◀</button><button class="ctrl" data-key="right" aria-label="Mover a la derecha">▶</button></div>
 <div class="cluster"><button class="ctrl small" data-key="attack" aria-label="Atacar">⚔ ATQ</button><button class="ctrl" data-key="jump" aria-label="Saltar">⬆</button></div>
</div>
<div id="overlay"><div id="panel">
 <h1>ECOS DEL MUNDO PERDIDO</h1>
 <p>Personaliza el color de tu explorador y comienza a buscar los fragmentos perdidos.</p>
 <div class="choices">
  <button class="swatch" data-color="#e9a35b" style="background:#e9a35b" aria-label="Naranja"></button>
  <button class="swatch" data-color="#72c9d6" style="background:#72c9d6" aria-label="Azul"></button>
  <button class="swatch" data-color="#d77db5" style="background:#d77db5" aria-label="Rosa"></button>
  <button class="swatch" data-color="#a58be8" style="background:#a58be8" aria-label="Morado"></button>
  <button class="swatch" data-color="#a8d96b" style="background:#a8d96b" aria-label="Verde"></button>
 </div>
 <p class="hint">◀ ▶ moverse · ⬆ saltar · ⚔ atacar</p>
 <button class="action" id="start">COMENZAR AVENTURA</button>
</div></div>
<div id="rotate"><div class="phone">📱 ↻</div><h2>Gira tu celular</h2><p>Este videojuego está diseñado para jugarse en horizontal. Gira tu dispositivo para continuar.</p></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
const W=960,H=540;
const held={left:false,right:false,jump:false,attack:false};
let heroColor='#e9a35b',score=0,hp=3,player,monsters,platforms,facing=1,attackReady=true;
function toast(message){
 const el=document.getElementById('toast');
 el.textContent=message;el.style.opacity='1';
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.style.opacity='0',1300);
}
function updateHud(){
 document.getElementById('health').textContent=hp>0?'♥ '.repeat(hp).trim():'Sin vida';
 document.getElementById('score').textContent='Fragmentos: '+score;
}
class Forest extends Phaser.Scene{
 constructor(){super('forest')}
 create(){
  // Crear las texturas antes de instanciar sprites evita los cuadros negros de textura faltante.
  this.makeTextures();
  this.physics.world.setBounds(0,0,2200,H);
  this.cameras.main.setBounds(0,0,2200,H);
  this.cameras.main.setBackgroundColor('#74dce0');

  for(let i=0;i<10;i++){
   this.add.circle(i*270+70,130,85,0x56b5a0).setScrollFactor(.25);
   this.add.circle(i*270+160,170,105,0x348b73).setScrollFactor(.4);
  }
  for(let x=0;x<2200;x+=100){
   this.add.rectangle(x+50,480,100,120,0x76503f);
   this.add.rectangle(x+50,420,100,18,0x75c957);
   this.add.rectangle(x+50,408,100,7,0xb2f078);
  }

  platforms=this.physics.add.staticGroup();
  const ground=platforms.create(1100,480,'pixel');
  ground.setDisplaySize(2200,120);ground.refreshBody();ground.setVisible(false);
  [[360,390,150],[650,330,150],[940,400,160],[1230,345,160],[1530,390,170],[1830,320,180]].forEach(([x,y,w])=>{
   const p=platforms.create(x,y,'pixel');
   p.setDisplaySize(w,20);p.refreshBody();p.setVisible(false);
   this.add.rectangle(x,y,w,14,0x77d45b).setStrokeStyle(3,0x315e46);
   this.add.rectangle(x,y+9,w,7,0x9b654b);
  });

  player=this.physics.add.sprite(90,380,'hero').setDepth(5);
  player.setCollideWorldBounds(true);player.body.setSize(24,34).setOffset(4,6);
  this.physics.add.collider(player,platforms);

  monsters=this.physics.add.group();
  [[500,390],[800,270],[1120,390],[1450,300],[1740,390]].forEach(([x,y])=>{
   const m=this.physics.add.sprite(x,y,'slime').setDepth(4);
   m.setCollideWorldBounds(true);m.body.setSize(30,22).setOffset(2,8);m.dir=-1;
   monsters.add(m);
  });
  this.physics.add.collider(monsters,platforms);

  const gems=this.physics.add.staticGroup();
  [[260,365],[430,300],[700,260],[1010,350],[1300,275],[1590,320],[1930,250]].forEach(([x,y])=>gems.create(x,y,'gem'));
  this.physics.add.overlap(player,gems,(p,g)=>{
   if(!g.active)return;
   g.destroy();score++;updateHud();toast('¡Fragmento encontrado!');
  });

  this.lastDamage=0;
  this.physics.add.overlap(player,monsters,(p,m)=>{
   if(!m.active)return;
   if(p.body.velocity.y>90 && p.y<m.y-7){
    m.destroy();p.setVelocityY(-300);toast('¡Criatura derrotada!');
   }else if(this.time.now>this.lastDamage+900){
    this.lastDamage=this.time.now;hp--;updateHud();
    p.setVelocityX(-facing*220);p.setTint(0xff7777);
    this.time.delayedCall(250,()=>{if(p.active)p.clearTint()});
    if(hp<=0)this.gameOver();
   }
  });

  this.add.text(35,35,'BOSQUE ANCESTRAL',{
   fontFamily:'monospace',fontSize:'20px',color:'#fff',stroke:'#24434a',strokeThickness:5
  }).setScrollFactor(0);
  this.cameras.main.startFollow(player,true,.08,.08);
  this.cameras.main.setDeadzone(180,100);
  this.keys=this.input.keyboard.addKeys({left:'A',right:'D',jump:'W',attack:'J'});
  this.cursors=this.input.keyboard.createCursorKeys();
  updateHud();
 }
 makeTextures(){
  const g=this.add.graphics();
  g.fillStyle(0xffffff);g.fillRect(0,0,2,2);g.generateTexture('pixel',2,2);g.clear();

  g.fillStyle(Phaser.Display.Color.HexStringToColor(heroColor).color);
  g.fillRect(5,12,22,24);
  g.fillStyle(0xffd2a0);g.fillRect(8,2,17,14);
  g.fillStyle(0x382c3b);g.fillRect(11,7,3,3);g.fillRect(20,7,3,3);
  g.fillStyle(0x49344a);g.fillRect(5,35,8,5);g.fillRect(20,35,8,5);
  g.generateTexture('hero',32,40);g.clear();

  g.fillStyle(0x8fe05e);g.fillRoundedRect(2,8,30,22,8);
  g.fillStyle(0x253b46);g.fillRect(9,15,4,5);g.fillRect(22,15,4,5);
  g.generateTexture('slime',34,34);g.clear();

  g.fillStyle(0xffdf65);
  g.fillPoints([{x:12,y:0},{x:24,y:12},{x:12,y:24},{x:0,y:12}],true);
  g.generateTexture('gem',24,24);
  g.destroy();
 }
 gameOver(){
  if(this.gameEnded)return;
  this.gameEnded=true;this.physics.pause();toast('Te quedaste sin energía. Reiniciando…');
  this.time.delayedCall(1400,()=>{
   hp=3;score=0;updateHud();this.scene.restart();
  });
 }
 update(){
  if(!player||!player.active||this.gameEnded)return;
  const left=held.left||this.keys.left.isDown||this.cursors.left.isDown;
  const right=held.right||this.keys.right.isDown||this.cursors.right.isDown;
  const jump=held.jump||this.keys.jump.isDown||this.cursors.up.isDown||this.cursors.space.isDown;
  const attack=held.attack||this.keys.attack.isDown;

  if(left){player.setVelocityX(-210);player.setFlipX(true);facing=-1}
  else if(right){player.setVelocityX(210);player.setFlipX(false);facing=1}
  else player.setVelocityX(0);

  if(jump&&player.body.blocked.down&&!this.jumpConsumed){
   player.setVelocityY(-430);this.jumpConsumed=true;
  }
  if(!jump)this.jumpConsumed=false;

  if(attack&&attackReady){
   attackReady=false;
   const area=new Phaser.Geom.Rectangle(player.x+(facing>0?15:-65),player.y-15,55,45);
   monsters.getChildren().slice().forEach(m=>{
    if(m.active&&Phaser.Geom.Rectangle.Contains(area,m.x,m.y)){
     m.destroy();toast('¡Ataque certero!');
    }
   });
   this.time.delayedCall(420,()=>attackReady=true);
  }

  monsters.getChildren().forEach(m=>{
   if(!m.active)return;
   if(Math.abs(m.x-player.x)<350)m.setVelocityX(m.x<player.x?55:-55);
   else m.setVelocityX(m.dir*35);
   if(m.body.blocked.left||m.body.blocked.right)m.dir*=-1;
  });

  if(player.y>H+80){
   hp--;updateHud();
   if(hp<=0)this.gameOver();
   else{player.setPosition(90,350);player.setVelocity(0,0)}
  }
 }
}
const config={
 type:Phaser.AUTO,parent:'game',width:W,height:H,pixelArt:true,
 physics:{default:'arcade',arcade:{gravity:{y:900},debug:false}},
 scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
 scene:[Forest]
};
document.querySelectorAll('.swatch').forEach(button=>{
 button.addEventListener('click',()=>{
  heroColor=button.dataset.color;
  document.querySelectorAll('.swatch').forEach(item=>item.style.borderColor='#ffffff88');
  button.style.borderColor='#fff';
 });
});
document.getElementById('start').addEventListener('click',async()=>{
 if(!window.Phaser){toast('No se pudo cargar el motor del juego. Revisa tu conexión.');return}
 try{
  if(document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen();
 }catch(error){}
 try{
  if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');
 }catch(error){}
 document.getElementById('overlay').style.display='none';
 new Phaser.Game(config);
});
document.querySelectorAll('.ctrl').forEach(button=>{
 const key=button.dataset.key;
 const down=event=>{event.preventDefault();held[key]=true};
 const up=event=>{event.preventDefault();held[key]=false};
 button.addEventListener('pointerdown',down);
 button.addEventListener('pointerup',up);
 button.addEventListener('pointerleave',up);
 button.addEventListener('pointercancel',up);
});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden)Object.keys(held).forEach(key=>held[key]=false);
});
</script>
</body>
</html>
